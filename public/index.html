<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101126"><title>MIND BATTLE — Игра с друзьями</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 80% 0%,#3b276f,#101126 55%);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:white}main{max-width:550px;margin:auto;padding:25px 18px 55px}h1{font-size:36px;line-height:1.1;margin:20px 0}h2{font-size:24px;line-height:1.2}h3{margin:10px 0}p{line-height:1.5}.muted{color:#b4b9d1}.logo{font-weight:900;letter-spacing:.13em;color:#c8b6ff}.card{background:#1d2440;border:1px solid #3c4267;border-radius:23px;padding:22px;margin:18px 0}.stat{background:#11182d;border-radius:14px;padding:12px}.stats{display:flex;gap:10px}.stats>*{flex:1}input{width:100%;padding:15px;border-radius:14px;background:#11162d;border:2px solid #4c547c;color:white;font-size:19px;margin:8px 0 12px}button{width:100%;border:0;border-radius:14px;padding:16px;background:#895af7;color:white;font-weight:800;font-size:16px;margin:7px 0;cursor:pointer}button.alt{background:#343e60}button:disabled{opacity:.5}.choices{display:grid;gap:9px}.choices button{text-align:left;background:#303b60;margin:0}.choices button.selected{outline:3px solid #ad8fff}.pill{display:inline-block;background:#3a2c6e;padding:7px 11px;border-radius:50px;color:#d9ceff;font-size:12px}.rank{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #3c4267;gap:8px}.green{color:#9df2c5}.hide{display:none}.error{color:#ffb3ba;min-height:20px}.timer{font-size:28px;font-weight:900}.small{font-size:13px}.answer{font-size:32px;font-weight:900;color:#a4f2ce}.code{font-size:40px;font-weight:900;letter-spacing:.12em;text-align:center}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row button{width:auto;padding:10px 13px}.footer{color:#888da8;text-align:center;font-size:12px;margin-top:35px}</style></head><body><main><div class="logo">🧠 MIND BATTLE</div><section id="landing"><h1>Битва умов.<br>Пять этапов.<br>Один победитель.</h1><p class="muted">Играй с друзьями на разных телефонах. 2–10 участников, 21 вопрос, комнаты по коду.</p><div class="card"><h2>Войти в игру</h2><label>Твоё имя</label><input id="name" maxlength="22" placeholder="Например, Алекс"><button id="create">Создать комнату</button><p class="muted small">Или подключись к друзьям</p><input id="code" inputmode="numeric" maxlength="6" placeholder="Код комнаты"><button class="alt" id="join">Войти по коду</button><p id="landingError" class="error"></p></div></section><section id="room" class="hide"><div class="card"><span id="phase" class="pill"></span><div class="row"><h2 id="roundTitle"></h2><span id="timer" class="timer"></span></div><div id="roomCode" class="code"></div><button id="share" class="alt hide">Поделиться ссылкой на комнату</button><p id="sub" class="muted"></p><div id="questionArea"></div><div id="results"></div><p id="roomError" class="error"></p><button id="start" class="hide">Начать игру</button><button id="next" class="hide">Следующий вопрос</button><button id="restart" class="hide">Играть ещё раз</button></div><div class="card"><h3>🏆 Рейтинг игроков</h3><div id="players"></div></div></section><div class="footer">MIND ARENA · MIND BATTLE · 5 раундов</div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id);let state=null,myId=null,session=null,submitted=false,choice=null;
try{session=JSON.parse(localStorage.getItem('mb_session')||'null')}catch(e){}
const urlCode=new URLSearchParams(location.search).get('room');if(urlCode)$('code').value=urlCode;
function showError(msg){$('roomError').textContent=msg||''}
function connect(kind){$('landingError').textContent='';const name=$('name').value.trim();if(!name){$('landingError').textContent='Введите имя';return}socket.emit(kind,{name,code:$('code').value.trim(),token:session?.token},res=>{if(res.error){$('landingError').textContent=res.error;return}myId=res.id;session={code:res.code,token:res.token,id:res.id};localStorage.setItem('mb_session',JSON.stringify(session));history.replaceState(null,'','?room='+res.code)})}
$('create').onclick=()=>connect('create');$('join').onclick=()=>connect('join');
socket.on('connect',()=>{if(session)socket.emit('resume',session,res=>{if(res.ok)myId=res.id;else{session=null;localStorage.removeItem('mb_session')}})});
function send(event,payload){showError('');socket.emit(event,payload||{},res=>{if(res?.error)showError(res.error);if(res?.ok&&event==='answer')submitted=true})}
$('start').onclick=()=>send('start');$('next').onclick=()=>send('next');$('restart').onclick=()=>send('restart');$('share').onclick=async()=>{const link=location.origin+'/?room='+state.code;try{if(navigator.share)await navigator.share({title:'MIND BATTLE',url:link});else{await navigator.clipboard.writeText(link);alert('Ссылка скопирована')}}catch(e){prompt('Скопируй ссылку',link)}};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){if(!state)return;$('landing').classList.add('hide');$('room').classList.remove('hide');const host=state.host===myId,q=state.question,phase=state.phase;$('phase').textContent={lobby:'ОЖИДАНИЕ ИГРОКОВ',question:'ВОПРОС',reveal:'РЕЗУЛЬТАТЫ',finished:'ИГРА ЗАВЕРШЕНА'}[phase];$('roundTitle').textContent=q?q.title:phase==='finished'?'Победитель определён':'Комната';$('roomCode').textContent=phase==='lobby'?state.code:'';$('share').classList.toggle('hide',phase!=='lobby');$('start').classList.toggle('hide',!(phase==='lobby'&&host));$('next').classList.toggle('hide',!(phase==='reveal'&&host));$('restart').classList.toggle('hide',!(phase==='finished'&&host));$('sub').textContent=phase==='lobby'?'Пригласи друзей. Минимум 2 игрока.':phase==='question'?`Вопрос ${q.number} из ${q.total} · Ответили: ${state.answered} из ${state.players.length}`:phase==='reveal'?'Посмотри правильный ответ и очки.': 'Спасибо за игру!';$('players').innerHTML=state.players.slice().sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="rank"><span>${i+1}. ${esc(p.name)} ${p.id===myId?'(ты)':''} ${!p.connected?'· офлайн':''}</span><strong>${p.score}</strong></div>`).join('');$('questionArea').innerHTML='';$('results').innerHTML='';if(phase==='question')drawQuestion(q);if(phase==='reveal')drawReveal();if(phase==='finished'){$('results').innerHTML='<h2>🏆 Победитель: '+esc(state.players.slice().sort((a,b)=>b.score-a.score)[0]?.name||'—')+'</h2>'}tick()}
function drawQuestion(q){const el=$('questionArea');el.innerHTML=`<span class="pill">Этап ${q.round+1} из 5</span><h2>${esc(q.prompt)}</h2>`;if(submitted){el.innerHTML+='<p class="green">✓ Ответ принят. Ждём остальных.</p>';return}if(q.type==='number'||q.type==='auction'){el.innerHTML+='<input id="value" type="number" inputmode="numeric" min="0" step="1" placeholder="Введи число">';if(q.type==='auction'){const score=state.players.find(p=>p.id===myId)?.score||0;el.innerHTML+=`<p class="muted small">Ставка: от 1 до 100 очков, но не выше твоего счёта (${score}). При правильном ответе +ставка, при ошибке −ставка.</p><input id="bet" type="number" inputmode="numeric" min="1" max="${Math.min(100,score)}" placeholder="Твоя ставка">`}}
 else {el.innerHTML+='<div class="choices">'+q.options.map((v,i)=>`<button class="opt" data-val="${q.type==='truth'?(i===0?'true':'false'):i}">${esc(v)}</button>`).join('')+'</div>';el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{choice=q.type==='truth'?b.dataset.val==='true':Number(b.dataset.val);el.querySelectorAll('.opt').forEach(x=>x.classList.toggle('selected',x===b))})}
 const btn=document.createElement('button');btn.textContent='Отправить ответ';btn.onclick=()=>{let val;if(q.type==='number'||q.type==='auction'){const raw=$('value').value;if(raw===''){showError('Введите ответ');return}val=Number(raw)}else{if(choice===null){showError('Выбери ответ');return}val=choice}send('answer',{value:val,bet:q.type==='auction'?Number($('bet').value):undefined})};el.appendChild(btn)}
function drawReveal(){const r=state.reveal;const qType=['number','choice','truth','auction','final'][state.index<5?0:state.index<10?1:state.index<15?2:state.index<18?3:4];let correct=r.correct;if(qType==='truth')correct=correct?'Правда':'Блеф';if(qType==='choice'||qType==='final'){const sets={choice:[['Фтор','Железо','Франций','Фосфор'],['Венера','Юпитер','Марс','Меркурий'],['Атлантический','Индийский','Северный Ледовитый','Тихий'],['Толстой','Достоевский','Чехов','Гоголь'],['45','60','90','180']],final:[['10','12','16','20'],['23','44','46','48'],['Вольфрам','Ванадий','Висмут','Водород']]};const qi=qType==='choice'?state.index-5:state.index-18;correct=sets[qType][qi][correct]}
 $('results').innerHTML=`<p class="muted">Правильный ответ</p><div class="answer">${esc(correct)}</div><p>${esc(r.explanation)}</p><h3>Ответы игроков</h3>`+r.answers.map(a=>`<div class="rank"><span>${esc(a.name)}: ${esc(a.value)}${a.bet?' · ставка '+a.bet:''}</span><strong class="${a.gain>0?'green':''}">${a.gain>0?'+':''}${a.gain}</strong></div>`).join('')}
function tick(){if(!state)return;const t=state.deadline?Math.max(0,Math.ceil((state.deadline-Date.now())/1000)):null;$('timer').textContent=t===null?'':t+'с'}setInterval(tick,300);
socket.on('state',s=>{const changed=!state||state.index!==s.index||state.phase!==s.phase;if(changed){submitted=false;choice=null}state=s;draw()});
</script></body></html>
